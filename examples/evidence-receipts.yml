name: assay-evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run under sandbox and review evidence
        uses: Rul1an/assay-action@v3
        with:
          # Run the test command under `assay sandbox` (Landlock, observe + record);
          # the action lints the resulting evidence bundle. Omit to only verify
          # pre-existing bundles matched by `bundles`.
          sandbox-command: pytest tests/
          bundles: ".assay/evidence/*.tar.gz"
          baseline_key: ${{ github.event.repository.name }}
          write_baseline: ${{ github.ref == 'refs/heads/main' }}
          fail_on: error
          # Optional: sign the evidence bundle as an in-toto/DSSE attestation.
          # attest-key: ${{ secrets.ASSAY_SIGNING_KEY }}
