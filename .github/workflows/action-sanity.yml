name: Action Sanity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly canary for GitHub runner, nested action, cache, and release-binary drift.
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fingerprint-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Simulate v2 fingerprint stability
        run: bash scripts/sim_fingerprint.sh

      - name: Verify release install contract
        run: bash scripts/test_release_install_contract.sh

      - name: Verify authoritative gate contract
        run: bash scripts/test_authoritative_gate.sh

      - name: Verify evidence index contract
        run: bash scripts/test_evidence_index_contract.sh

      - name: Verify published-tag canary contract
        run: bash scripts/test_published_tag_canary_contract.sh

      - name: Verify executable docs match selected action contracts
        run: ruby scripts/test_docs_action_contract.rb

  capability-diff-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Simulate experimental capability diff
        run: bash scripts/sim_capability_diff.sh

  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Exercise local action install path
        if: github.event_name == 'pull_request'
        id: local-install
        uses: ./
        with:
          bundles: ".assay/evidence/*.tar.gz"
          fail_on: error
          sarif: false
          comment_diff: false

      - name: Assert additive evidence outputs (no bundles)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EVIDENCE_STATE: ${{ steps.local-install.outputs.evidence_state }}
          VERIFIED: ${{ steps.local-install.outputs.verified }}
          INDEX_PATH: ${{ steps.local-install.outputs.evidence_index_path }}
          INDEX_DIGEST: ${{ steps.local-install.outputs.evidence_index_digest }}
        run: |
          set -euo pipefail
          test "$EVIDENCE_STATE" = "absent"
          test "$VERIFIED" = "false"
          test -n "$INDEX_PATH"
          test -n "$INDEX_DIGEST"
          test -f "$INDEX_PATH"
          python3 -c '
          import hashlib, json, sys
          path = sys.argv[1]
          raw = open(path, "rb").read()
          d = json.loads(raw)
          assert d["complete"] is True
          assert d["bundles"] == []
          assert hashlib.sha256(raw).hexdigest() == sys.argv[2]
          ' "$INDEX_PATH" "$INDEX_DIGEST"

      - name: Exercise released action install path
        if: github.event_name != 'pull_request'
        uses: Rul1an/assay-action@v2
        with:
          bundles: ".assay/evidence/*.tar.gz"
          fail_on: error
          sarif: false
          comment_diff: false


  # Issue #40: real released CLI produces discoverable sandbox evidence; Action
  # auto-discovers it with bundles unset and evidence_mode required.
  default-discovery-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install released Assay CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.assay/bin"
          CURL_ARGS=(
            --retry 3
            --retry-delay 2
            --retry-all-errors
            -fsSL
            -H "Accept: application/vnd.github+json"
            -H "User-Agent: assay-action-installer"
          )
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            CURL_ARGS+=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          fi
          VERSION=$(
            curl "${CURL_ARGS[@]}"               "https://api.github.com/repos/Rul1an/assay/releases/latest" |
              sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' |
              head -n 1
          )
          test -n "$VERSION"
          TARGET="x86_64-unknown-linux-gnu"
          DOWNLOAD_URL="https://github.com/Rul1an/assay/releases/download/${VERSION}/assay-${VERSION}-${TARGET}.tar.gz"
          CHECKSUM_URL="${DOWNLOAD_URL}.sha256"
          TEMP_DIR=$(mktemp -d)
          ARCHIVE_PATH="${TEMP_DIR}/assay.tar.gz"
          CHECKSUM_PATH="${TEMP_DIR}/assay.tar.gz.sha256"
          curl "${CURL_ARGS[@]}" "$DOWNLOAD_URL" -o "$ARCHIVE_PATH"
          curl "${CURL_ARGS[@]}" "$CHECKSUM_URL" -o "$CHECKSUM_PATH"
          EXPECTED_HASH=$(awk '{print $1}' "$CHECKSUM_PATH" | head -n 1 | tr -d '\r\n')
          ACTUAL_HASH=$(sha256sum "$ARCHIVE_PATH" | awk '{print $1}')
          test "$ACTUAL_HASH" = "$EXPECTED_HASH"
          tar xzf "$ARCHIVE_PATH" -C "$TEMP_DIR"
          BINARY=$(find "$TEMP_DIR" -type f -name "assay" | head -n 1)
          test -n "$BINARY"
          mv "$BINARY" "$HOME/.assay/bin/assay"
          chmod +x "$HOME/.assay/bin/assay"
          rm -rf "$TEMP_DIR"
          echo "$HOME/.assay/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.assay/bin:$PATH"
          assay --version

      - name: Produce fresh sandbox evidence
        id: produce
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.assay/bin:$PATH"
          mkdir -p .assay/sandbox .assay/evidence
          assay sandbox --dry-run \
            --profile .assay/sandbox/profile.yaml \
            --bundle .assay/evidence/sandbox.tar.gz \
            -- true
          test -f .assay/evidence/sandbox.tar.gz
          PRODUCED_SHA=$(sha256sum .assay/evidence/sandbox.tar.gz | awk '{print $1}')
          echo "bundle_sha=$PRODUCED_SHA" >> "$GITHUB_OUTPUT"
          echo "Produced .assay/evidence/sandbox.tar.gz sha256=$PRODUCED_SHA"

      - name: Review auto-discovered sandbox evidence
        id: review
        uses: ./
        with:
          evidence_mode: required
          fail_on: error
          sarif: false
          comment_diff: false

      - name: Assert discovered sandbox evidence is verified
        shell: bash
        env:
          EVIDENCE_STATE: ${{ steps.review.outputs.evidence_state }}
          VERIFIED: ${{ steps.review.outputs.verified }}
          INDEX_PATH: ${{ steps.review.outputs.evidence_index_path }}
          INDEX_DIGEST: ${{ steps.review.outputs.evidence_index_digest }}
          PRODUCED_SHA: ${{ steps.produce.outputs.bundle_sha }}
        run: |
          set -euo pipefail
          test "$EVIDENCE_STATE" = "verified"
          test "$VERIFIED" = "true"
          test -n "$INDEX_DIGEST"
          test -f "$INDEX_PATH"
          python3 -c '
          import hashlib, json, sys
          path = sys.argv[1]
          digest = sys.argv[2]
          produced = sys.argv[3]
          raw = open(path, "rb").read()
          d = json.loads(raw)
          assert d["complete"] is True
          assert hashlib.sha256(raw).hexdigest() == digest
          assert len(d["bundles"]) == 1
          row = d["bundles"][0]
          assert row["path"] == ".assay/evidence/sandbox.tar.gz"
          assert row["source"] == "discovered"
          assert row["integrity"] == "verified"
          assert row["sha256"] == produced
          ' "$INDEX_PATH" "$INDEX_DIGEST" "$PRODUCED_SHA"

  required-zero-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Exercise required mode with zero bundles
        id: required-zero
        continue-on-error: true
        uses: ./
        with:
          evidence_mode: required
          bundles: ".assay/evidence/*.tar.gz"
          fail_on: error
          sarif: false
          comment_diff: false

      - name: Assert required-zero composite failure
        shell: bash
        env:
          OUTCOME: ${{ steps.required-zero.outcome }}
          EVIDENCE_STATE: ${{ steps.required-zero.outputs.evidence_state }}
          VERIFIED: ${{ steps.required-zero.outputs.verified }}
          INDEX_PATH: ${{ steps.required-zero.outputs.evidence_index_path }}
          INDEX_DIGEST: ${{ steps.required-zero.outputs.evidence_index_digest }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure"
          test "$EVIDENCE_STATE" = "absent"
          test "$VERIFIED" = "false"
          test -n "$INDEX_DIGEST"
          test -f "$INDEX_PATH"
          python3 -c '
          import hashlib, json, sys
          path = sys.argv[1]
          raw = open(path, "rb").read()
          d = json.loads(raw)
          assert d["complete"] is True
          assert d["bundles"] == []
          assert hashlib.sha256(raw).hexdigest() == sys.argv[2]
          ' "$INDEX_PATH" "$INDEX_DIGEST"

  baseline-delta-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Create deterministic evidence fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin .assay/evidence
          touch .assay/evidence/noop.tar.gz
          cat > bin/assay <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ "${1:-}" = "--version" ]; then
            echo "assay 3.35.0"
            exit 0
          fi

          if [ "${1:-}" = "evidence" ] && [ "${2:-}" = "verify" ]; then
            exit 0
          fi

          if [ "${1:-}" = "evidence" ] && [ "${2:-}" = "lint" ] && [ "${3:-}" = "--format" ] && [ "${4:-}" = "json" ]; then
            printf '%s\n' '{"findings":[]}'
            exit 0
          fi

          if [ "${1:-}" = "evidence" ] && [ "${2:-}" = "lint" ] && [ "${3:-}" = "--format" ] && [ "${4:-}" = "sarif" ]; then
            printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Assay Action Sanity","informationUri":"https://github.com/Rul1an/assay-action"}},"results":[]}]}'
            exit 0
          fi

          echo "unsupported assay sanity command: $*" >&2
          exit 2
          SH
          chmod +x bin/assay
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Review deterministic evidence fixture with local action
        id: local-review
        uses: ./
        with:
          version: v3.35.0
          bundles: ".assay/evidence/*.tar.gz"
          fail_on: error
          sarif: false
          comment_diff: false
          baseline_key: action-sanity
          write_baseline: false

      - name: Assert additive evidence outputs (fixture)
        shell: bash
        env:
          EVIDENCE_STATE: ${{ steps.local-review.outputs.evidence_state }}
          VERIFIED: ${{ steps.local-review.outputs.verified }}
          INDEX_PATH: ${{ steps.local-review.outputs.evidence_index_path }}
          INDEX_DIGEST: ${{ steps.local-review.outputs.evidence_index_digest }}
        run: |
          set -euo pipefail
          test "$EVIDENCE_STATE" = "verified"
          test "$VERIFIED" = "true"
          test -n "$INDEX_DIGEST"
          test -f "$INDEX_PATH"
          python3 -c '
          import hashlib, json, sys
          path = sys.argv[1]
          raw = open(path, "rb").read()
          d = json.loads(raw)
          assert d["complete"] is True
          assert len(d["bundles"]) == 1
          assert hashlib.sha256(raw).hexdigest() == sys.argv[2]
          ' "$INDEX_PATH" "$INDEX_DIGEST"

  baseline-delta-trusted:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Create deterministic evidence fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin .assay/evidence
          touch .assay/evidence/noop.tar.gz
          cat > bin/assay <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ "${1:-}" = "--version" ]; then
            echo "assay action-sanity"
            exit 0
          fi

          if [ "${1:-}" = "evidence" ] && [ "${2:-}" = "verify" ]; then
            exit 0
          fi

          if [ "${1:-}" = "evidence" ] && [ "${2:-}" = "lint" ] && [ "${3:-}" = "--format" ] && [ "${4:-}" = "json" ]; then
            printf '%s\n' '{"findings":[]}'
            exit 0
          fi

          if [ "${1:-}" = "evidence" ] && [ "${2:-}" = "lint" ] && [ "${3:-}" = "--format" ] && [ "${4:-}" = "sarif" ]; then
            printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1/schema/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Assay Action Sanity","informationUri":"https://github.com/Rul1an/assay-action"}},"results":[]}]}'
            exit 0
          fi

          echo "unsupported assay sanity command: $*" >&2
          exit 2
          SH
          chmod +x bin/assay
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Review deterministic evidence fixture with released action
        uses: Rul1an/assay-action@v2
        with:
          bundles: ".assay/evidence/*.tar.gz"
          fail_on: error
          sarif: false
          comment_diff: false
          baseline_key: action-sanity
          write_baseline: ${{ github.ref == 'refs/heads/main' }}
