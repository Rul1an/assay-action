name: Action Sanity

on:
  pull_request:
    paths:
      - ".github/workflows/action-sanity.yml"
      - "action.yml"
      - "README.md"
      - "examples/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/action-sanity.yml"
      - "action.yml"
      - "README.md"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  baseline-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create deterministic evidence fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin .assay/evidence
          touch .assay/evidence/noop.tar.gz
          cat > bin/assay <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ "${1:-}" = "--version" ]; then
            echo "assay action-sanity"
            exit 0
          fi

          if [ "${1:-}" = "evidence" ] && [ "${2:-}" = "verify" ]; then
            exit 0
          fi

          if [ "${1:-}" = "evidence" ] && [ "${2:-}" = "lint" ] && [ "${3:-}" = "--format" ] && [ "${4:-}" = "json" ]; then
            printf '%s\n' '{"findings":[]}'
            exit 0
          fi

          if [ "${1:-}" = "evidence" ] && [ "${2:-}" = "lint" ] && [ "${3:-}" = "--format" ] && [ "${4:-}" = "sarif" ]; then
            printf '%s\n' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Assay Action Sanity","informationUri":"https://github.com/Rul1an/assay-action"}},"results":[]}]}'
            exit 0
          fi

          echo "unsupported assay sanity command: $*" >&2
          exit 2
          SH
          chmod +x bin/assay
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Review deterministic evidence fixture
        uses: Rul1an/assay-action@v2
        with:
          bundles: ".assay/evidence/*.tar.gz"
          fail_on: error
          sarif: false
          comment_diff: false
          baseline_key: action-sanity
          write_baseline: ${{ github.ref == 'refs/heads/main' }}
